<style>
/* Layout: a one-column personal statement. Header line with the as-of date, one filter row,
   the net worth figure with four tiles, the history chart full width, then allocation and
   accounts side by side on wide screens, holdings and budget full width below. */
:root {
  --plane: #f3f4f1;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --ink-3: #66655f;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --line: rgba(11, 11, 11, 0.10);
  --wash: rgba(11, 11, 11, 0.045);
  --pos: #006300;
  --neg: #c4302f;
  --chip-bg: #fbf0d3;
  --chip-ink: #6b4a00;
  --focus: #2a78d6;
  --on-ink: #fcfcfb;
  --s-invested: #2a78d6;
  --s-cash: #eb6834;
  --s-retirement: #1baf7a;
  --s-property: #eda100;
  --s-other: #e87ba4;
  --s-debt: #898781;
  --bar: #2a78d6;
  --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --plane: #0e0f0e; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #a9a89f;
    --muted: #898781; --grid: #2c2c2a; --axis: #383835; --line: rgba(255, 255, 255, 0.10);
    --wash: rgba(255, 255, 255, 0.05); --pos: #2fb344; --neg: #f07c7c; --chip-bg: #3a2c0b;
    --chip-ink: #f5c860; --focus: #3987e5; --on-ink: #1a1a19; --s-invested: #3987e5;
    --s-cash: #d95926; --s-retirement: #199e70; --s-property: #c98500; --s-other: #d55181;
    --s-debt: #898781; --bar: #3987e5; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --plane: #0e0f0e; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #a9a89f;
  --muted: #898781; --grid: #2c2c2a; --axis: #383835; --line: rgba(255, 255, 255, 0.10);
  --wash: rgba(255, 255, 255, 0.05); --pos: #2fb344; --neg: #f07c7c; --chip-bg: #3a2c0b;
  --chip-ink: #f5c860; --focus: #3987e5; --on-ink: #1a1a19; --s-invested: #3987e5;
  --s-cash: #d95926; --s-retirement: #199e70; --s-property: #c98500; --s-other: #d55181;
  --s-debt: #898781; --bar: #3987e5; color-scheme: dark;
}
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--plane); color: var(--ink); font: 15px/1.5 var(--font); }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.app {
  max-width: 1120px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
  display: flex; flex-direction: column; gap: 16px;
}
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.top h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.005em; text-wrap: balance; }
.meta { margin: 2px 0 0; color: var(--ink-3); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.meta span + span::before { content: "·"; margin-right: 10px; color: var(--muted); }
.ghost {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface);
  border-radius: 8px; padding: 6px 10px; font-size: 13px; cursor: pointer; color: var(--ink-2);
}
.ghost:hover { background: var(--wash); }
.ghost svg { width: 16px; height: 16px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.filters .lbl { font-size: 12px; color: var(--ink-3); margin-right: 6px; letter-spacing: 0.02em; }
.fgroup { display: flex; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 2px; gap: 2px; }
.seg button {
  border: 0; background: transparent; border-radius: 6px; padding: 4px 10px; font-size: 13px; cursor: pointer;
  color: var(--ink-2); font-weight: 500; min-height: 28px;
}
.seg button:hover { background: var(--wash); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
.note-line { font-size: 12px; color: var(--ink-3); margin: 0; }
.banner { font-size: 13px; color: var(--chip-ink); background: var(--chip-bg); border-radius: 8px; padding: 8px 12px; margin: 0; }

.hero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.4fr); gap: 16px 28px; align-items: end; }
.hero-main { min-width: 0; }
.eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); font-weight: 500; margin: 0; }
.hero-value { font-size: clamp(40px, 8vw, 60px); line-height: 1.05; font-weight: 600; letter-spacing: -0.025em; margin: 6px 0 8px; overflow-wrap: anywhere; }
.delta { font-size: 14px; display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: baseline; }
.delta .amt { font-weight: 600; }
.up { color: var(--pos); }
.down { color: var(--neg); }
.flat { color: var(--ink-2); }
.split { font-size: 13px; color: var(--ink-3); margin-top: 4px; display: flex; flex-wrap: wrap; gap: 2px 12px; }
.split b { font-weight: 500; color: var(--ink-2); }
.goal { margin-top: 12px; max-width: 420px; }
.meter { height: 6px; border-radius: 3px; background: var(--wash); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--ink-2); border-radius: 3px; }
.goal p { margin: 6px 0 0; font-size: 12px; color: var(--ink-3); }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0 20px; }
.tile { border-top: 1px solid var(--axis); padding-top: 10px; min-width: 0; }
.tile .k { font-size: 12px; color: var(--ink-3); }
.tile .v { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; margin: 2px 0; overflow-wrap: anywhere; }
.tile .s { font-size: 12px; color: var(--ink-3); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px 18px; min-width: 0; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; margin-bottom: 10px; }
.panel h2 { margin: 0; font-size: 15px; font-weight: 600; }
.panel .sub { margin: 2px 0 0; font-size: 12px; color: var(--ink-3); }
.head-ctl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); margin: 0 0 8px; padding: 0; list-style: none; }
.legend li { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; flex: none; }
.lk { width: 14px; height: 2px; border-radius: 1px; display: inline-block; flex: none; }
.chart { position: relative; touch-action: pan-y; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart:focus-visible { outline-offset: 4px; border-radius: 4px; }
.empty-note { font-size: 13px; color: var(--ink-3); margin: 8px 0 0; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 16px; align-items: start; }

.stackbar { display: flex; gap: 2px; height: 12px; margin: 4px 0 14px; }
.stackbar i { display: block; height: 100%; min-width: 2px; }
.stackbar i:first-child { border-radius: 4px 0 0 4px; }
.stackbar i:last-child { border-radius: 0 4px 4px 0; }
.stackbar i:only-child { border-radius: 4px; }
.rows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto 52px; gap: 4px 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--grid); font-size: 14px; }
.row:last-child { border-bottom: 0; }
.row .name { min-width: 0; overflow-wrap: anywhere; }
.row .val, .row .pc { text-align: right; font-variant-numeric: tabular-nums; }
.row .pc { color: var(--ink-3); font-size: 13px; }
.row .track { grid-column: 2 / -1; height: 4px; border-radius: 2px; background: var(--wash); }
.row .track i { display: block; height: 100%; border-radius: 2px; }
.foot-note { font-size: 12px; color: var(--ink-3); margin: 10px 0 0; }

.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
th { text-align: left; font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-3); padding: 6px 8px; border-bottom: 1px solid var(--axis); white-space: nowrap; }
td { padding: 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
th:first-child, td:first-child { padding-left: 0; }
th:last-child, td:last-child { padding-right: 0; }
.num { text-align: right; white-space: nowrap; }
th.num { text-align: right; }
tr.grp td { padding-top: 14px; font-weight: 600; border-bottom-color: var(--axis); }
tr.grp .gl { display: inline-flex; align-items: center; gap: 8px; }
td .nm { font-weight: 500; }
td .in { display: block; font-size: 12px; color: var(--ink-3); }
.chip { display: inline-block; font-size: 11px; line-height: 1.6; padding: 0 6px; border-radius: 999px; background: var(--chip-bg); color: var(--chip-ink); margin-left: 6px; font-weight: 500; white-space: nowrap; vertical-align: 1px; }
.sortbtn { border: 0; background: none; padding: 0; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; }
.sortbtn .ar { opacity: 0; font-size: 10px; }
th[aria-sort] .sortbtn .ar { opacity: 1; }
.minis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
.mini .k { font-size: 12px; color: var(--ink-3); }
.mini .v { font-size: 18px; font-weight: 600; }
.cats { margin-top: 14px; }
.cats h3 { font-size: 13px; font-weight: 600; margin: 0 0 4px; }
.cat { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 2px 12px; padding: 6px 0; border-bottom: 1px solid var(--grid); font-size: 14px; align-items: center; }
.cat:last-child { border-bottom: 0; }
.cat .track { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: var(--wash); }
.cat .track i { display: block; height: 100%; background: var(--bar); border-radius: 2px; }
.cat .vs { font-size: 12px; min-width: 76px; text-align: right; font-variant-numeric: tabular-nums; }
.cat .val { text-align: right; font-variant-numeric: tabular-nums; }

.tip {
  position: fixed; z-index: 20; pointer-events: none; background: var(--surface); color: var(--ink);
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12px; min-width: 150px;
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.14); font-variant-numeric: tabular-nums;
}
.tip .td { font-size: 11px; color: var(--ink-3); margin-bottom: 4px; }
.tip .tr { display: grid; grid-template-columns: 14px auto 1fr; gap: 8px; align-items: center; padding: 1px 0; }
.tip .tr b { font-weight: 600; font-size: 13px; }
.tip .tr span:last-child { color: var(--ink-3); }
footer { font-size: 12px; color: var(--ink-3); display: flex; flex-wrap: wrap; gap: 4px 14px; padding-top: 4px; }
footer a { color: var(--ink-2); }
.hidden-amt { letter-spacing: 0.1em; }

@media (max-width: 900px) {
  .hero { grid-template-columns: minmax(0, 1fr); }
  .grid2 { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) {
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 16px; }
  .minis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hide-sm { display: none; }
  .panel { padding: 14px 14px 16px; }
  table { font-size: 13px; }
}
@media (prefers-reduced-motion: no-preference) {
  .seg button, .ghost { transition: background-color 120ms ease, color 120ms ease; }
}
</style>

  function dt2(k) { return mDate(k); }
  function renderCats(box, months, sel) {
    var totals = {}, cats = sel.m.expenses || {};
    months.forEach(function (x) { for (var c in (x.m.expenses || {})) totals[c] = (totals[c] || 0) + (+x.m.expenses[c] || 0); });
    var list = Object.keys(cats).map(function (c) { return { c: c, v: +cats[c] || 0, avg: (totals[c] || 0) / months.length }; })
      .filter(function (r) { return r.v > 0; }).sort(function (a, b) { return b.v - a.v; });
    box.appendChild(h('h3', { text: t('categories', { month: fMonthLong.format(mDate(sel.key)) }) }));
    var maxV = Math.max.apply(null, list.map(function (r) { return r.v; }).concat([1]));
    list.forEach(function (r) {
      var diff = r.avg ? (r.v - r.avg) / r.avg : null;
      var cls = diff == null || Math.abs(diff) < 0.05 ? 'flat' : diff > 0 ? 'down' : 'up';
      box.appendChild(h('div', { class: 'cat' }, h('span', { text: r.c }),
        h('span', { class: 'vs ' + cls, text: diff == null ? '' : spct(diff) + ' ' + t('vsAvg') }),
        h('span', { class: 'val', text: money(r.v) + ' · ' + fPct0.format(r.v / (sel.exp || 1)) }),
        h('span', { class: 'track', 'aria-hidden': 'true' }, h('i', { style: { width: (r.v / maxV * 100) + '%' } }))));
    });
  }

  // -------------------------------------------------------------- footer
  function renderFooter() {
    var f = $('footer');
    f.textContent = '';
    if (N) add(f, h('span', { text: t('snapshots', { n: N }) }));
    if (S.updated) add(f, h('span', { text: t('updated', { date: fDate.format(d(S.updated)) }) }));
    add(f, h('span', { text: t('disclaimer') }));
    add(f, h('a', { href: 'https://github.com/dancingpea/wealth-dashboard', target: '_blank', rel: 'noopener', text: t('madeWith') }));
  }

  // ---------------------------------------------------------------- main
  function renderMain() {
    var main = $('main');
    var y = window.scrollY;
    main.textContent = '';
    hideTip();
    renderHeader();
    if (!N) {
      main.appendChild(h('section', { class: 'panel' }, h('p', { style: { margin: '0' }, text: t('empty') })));
      renderFooter();
      return;
    }
    var stack = h('div', { style: { display: 'flex', 'flex-direction': 'column', gap: '16px' } });
    main.appendChild(stack);
    renderFilters(stack);
    var ps = periodStats();
    renderHero(stack, ps);
    renderChartPanel(stack, ps);
    var g2 = h('div', { class: 'grid2' });
    stack.appendChild(g2);
    renderAllocation(g2);
    renderAccounts(g2, ps);
    renderHoldings(stack);
    renderBudget(stack);
    renderFooter();
    renderChartLegend();
    drawNetChart();
    window.scrollTo(0, y);
  }

  $('hide-btn').addEventListener('click', function () { state.hide = !state.hide; savePrefs(); renderMain(); });
  var lastW = 0, raf = 0;
  function onResize() {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(function () {
      var w = $('main').getBoundingClientRect().width;
      if (Math.abs(w - lastW) < 2) return;
      lastW = w;
      drawNetChart();
      var bb = $('bchart');
      if (bb) { var b = budgetSummary(); var sel = b.months.filter(function (x) { return x.key === state.budgetSel; })[0] || b.months[b.months.length - 1]; drawBudget(bb, b.months, sel); }
    });
  }
  if (window.ResizeObserver) new ResizeObserver(onResize).observe($('main'));
  else window.addEventListener('resize', onResize);
  renderMain();
  lastW = $('main').getBoundingClientRect().width;
})();
</script>
</body>
</html>
